
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация — PawHome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <nav class="navbar">
        <a href="index.html" class="logo">🐾 PawHome</a>
        <button type="button" class="menu-toggle"
                aria-label="Открыть меню"
                aria-expanded="false">☰</button>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="animals.html">Наши животные</a>
            <a href="index.html#about">О нас</a>
            <a href="login.html" class="login-btn">Войти</a>
        </div>
    </nav>
</header>


<main class="auth-page">
    <section class="auth-card">
        <div class="auth-icon">🐾</div>
        <h1 id="authTitle">С возвращением!</h1>
        <p class="auth-subtitle" id="authSubtitle">
            Войдите, чтобы продолжить знакомство с питомцами.
        </p>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-mode="login">
                Вход
            </button>
            <button type="button" class="auth-tab" data-mode="register">
                Регистрация
            </button>
        </div>

        <form id="authForm" novalidate>
            <div class="form-group" id="nameGroup" hidden>
                <label for="fullName">Ваше имя</label>
                <input type="text" id="fullName"
                       placeholder="Например, Алексей"
                       autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email"
                       placeholder="example@gmail.com"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password"
                       placeholder="Введите пароль"
                       autocomplete="current-password"
                       minlength="8" required>
            </div>

            <div class="form-group" id="confirmGroup" hidden>
                <label for="confirmPassword">
                    Подтвердите пароль
                </label>
                <input type="password" id="confirmPassword"
                       placeholder="Повторите пароль"
                       autocomplete="new-password">
            </div>

            <p id="formMessage" class="form-message"
               role="status" aria-live="polite"></p>

            <button class="btn btn-primary auth-submit"
                    type="submit" id="submitButton">
                Войти
            </button>
        </form>

        <p class="auth-note">
            С любовью к каждому хвостику 
        </p>
    </section>
</main>

<footer>
    <p>© 2026 PawHome. Создано с заботой о животных</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
